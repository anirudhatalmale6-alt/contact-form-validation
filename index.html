<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact Us</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <main class="page">
    <section class="card">
      <h1>Get in touch</h1>
      <p class="lede">Send us a message and we&rsquo;ll get back to you shortly.</p>

      <!-- novalidate turns off the browser's native bubbles so our own messages show instead -->
      <form id="contactForm" class="contact-form" novalidate>

        <div class="field">
          <label for="name">Name</label>
          <input type="text" id="name" name="name" autocomplete="name" placeholder="Jane Doe">
          <span class="error" id="nameError" role="alert"></span>
        </div>

        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" autocomplete="email" placeholder="jane@example.com">
          <span class="error" id="emailError" role="alert"></span>
        </div>

        <div class="field">
          <label for="message">Message <span class="optional">(optional)</span></label>
          <textarea id="message" name="message" rows="4" placeholder="How can we help?"></textarea>
        </div>

        <button type="submit" class="btn">Send message</button>
      </form>

      <!-- Success panel: lives in the markup, hidden until submit succeeds -->
      <div id="formSuccess" class="form-success" role="status" aria-live="polite" hidden>
        <span class="form-success__icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none"
               stroke="currentColor" stroke-width="2.5"
               stroke-linecap="round" stroke-linejoin="round">
            <polyline points="4 12.5 9.5 18 20 6.5"></polyline>
          </svg>
        </span>
        <span class="form-success__text">
          <strong>Thanks, <span id="successName">there</span>!</strong>
          Your message has been sent. We&rsquo;ll reply to
          <span id="successEmail" class="form-success__email"></span> soon.
        </span>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
